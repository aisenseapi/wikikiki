# wikikiki — example operator config
# Copy to wikikiki.toml and edit. Every value has a sensible default;
# you can ship with an empty config and the server still runs.

[paths]
content_root      = "./content"
db_path           = "./wikikiki.db"
git_repo          = "./content"          # usually equal to content_root

[server]
bind              = "127.0.0.1:8090"
public_url        = "http://localhost:8090"

[ui]
markdown_renderer    = "comrak"
allow_anonymous_read = true
require_auth_for_write = true

[auth]
session_lifetime       = "30d"
token_default_lifetime = "1y"
log_remote_addr        = "hashed"        # 'plain' | 'hashed' | 'none'

[git]
author_template = "{actor_type}:{actor_handle} <{actor_handle}@wikikiki.local>"

# Stage 1 defers L1, distillation, real-time, MCP, conflicts, rate limits, loop detection.
# Their config blocks live in DESIGN.md §4 and will activate as later stages land.
