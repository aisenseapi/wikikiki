services:
  wikikiki:
    build: .
    image: wikikiki:local
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${WIKIKIKI_PORT:-8090}:8090"
    environment:
      WIKIKIKI_BIND: "0.0.0.0:8090"
    volumes:
      - wikikiki_data:/data
      - type: bind
        source: ./wikikiki.toml
        target: /etc/wikikiki/wikikiki.toml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  wikikiki_data:
    name: "${WIKIKIKI_VOLUME:-wikikiki-data}"
